<style>
:root{--bg:#090d10;--panel:#10171c;--line:#365158;--text:#f0f1e9;--muted:#9eadae;--cyan:#6edfd4;--mint:#c1e8ce;--bronze:#c59a67}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{padding:12px}
a{color:inherit;text-decoration:none}
.card{min-height:220px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at 88% 15%,#183b3c 0,transparent 28%),linear-gradient(100deg,#0c1418,#102326 60%,#131918);display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:28px;align-items:center;padding:28px 32px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--cyan),var(--mint))}
.bot{width:104px;height:104px;border-radius:50%;border:8px solid #d7e2e3;background:#c7d5d7;position:relative;box-shadow:0 0 0 1px #799195}
.bot:before{content:"";position:absolute;inset:16px;border-radius:50%;background:#071014;border:3px solid #4c676c}
.bot:after{content:"••";position:absolute;left:31px;top:28px;color:var(--cyan);font-size:28px;letter-spacing:5px;text-shadow:0 0 12px var(--cyan)}
.kicker{font:10px ui-monospace,monospace;letter-spacing:.14em;color:var(--cyan);margin-bottom:10px}.title{font:400 clamp(28px,4.4vw,54px)/.95 Georgia,serif;letter-spacing:-.04em;margin:0}.title em{font-style:normal;color:var(--cyan)}.sub{margin:13px 0 0;color:#c6d1cf;font-size:13px;line-height:1.5}.tags{display:flex;gap:7px;margin-top:15px}.tag{border:1px solid #3e5153;border-radius:999px;padding:5px 8px;font:9px ui-monospace,monospace}.tag:nth-child(1){color:var(--cyan)}.tag:nth-child(2){color:var(--mint)}.tag:nth-child(3){color:var(--bronze)}
.open{display:grid;place-items:center;width:112px;height:112px;border:1px solid #4f847e;border-radius:50%;color:var(--cyan);font:10px/1.35 ui-monospace,monospace;text-align:center}.open b{font-size:22px;font-weight:400}
@media(max-width:680px){.card{grid-template-columns:80px 1fr;padding:22px 20px;gap:18px;min-height:190px}.bot{width:72px;height:72px;border-width:6px}.bot:before{inset:10px}.bot:after{left:20px;top:17px;font-size:22px}.open{display:none}.title{font-size:32px}.sub{font-size:11px}}

.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 28%,#1769a677,transparent 30%),radial-gradient(circle at 15% 90%,#3ec6ff22,transparent 26%);pointer-events:none}
.card:after{content:"EXPLORE →";position:absolute;right:18px;bottom:16px;padding:7px 10px;border:1px solid #ffe14a;border-radius:999px;background:#6b4b00;color:#fff5a8;font:800 9px ui-monospace,monospace;letter-spacing:.08em}
