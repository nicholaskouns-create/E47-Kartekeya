name: assemble-sync-staging
on:
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/supabase-runtime-source-20260927
      - name: Assemble staged base64 parts
        run: |
          python3 << 'PY'
          import base64, hashlib, json
          from pathlib import Path
          man = json.loads(Path('.sync-staging/manifest.json').read_text())
          for slug, meta in man.items():
            parts = []
            for p in meta['parts']:
              data = Path(p['path']).read_text().strip()
              got = hashlib.sha256(data.encode()).hexdigest()
              assert got == p['sha256'], (p['path'], got, p['sha256'])
              assert len(data) == p['len'], p['path']
              parts.append(data)
            raw = base64.b64decode(''.join(parts))
            assert hashlib.sha256(raw).hexdigest() == meta['raw_sha256']
            assert len(raw) == meta['raw_len']
            Path(meta['repo_path']).parent.mkdir(parents=True, exist_ok=True)
            Path(meta['repo_path']).write_bytes(raw)
            print('OK', slug, len(raw))
          PY
      - name: Commit assembled sources
        run: |
          git config user.name "E47 Sync Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "sync(supabase): assemble linguistics-bureau-translator from verified staging parts"
          git push origin HEAD:sync/supabase-runtime-source-20260927
