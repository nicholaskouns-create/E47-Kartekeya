name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function:
        description: "Optional single function slug (empty = all changed / all)"
        required: false
        default: ""

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve functions to deploy
        id: list
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.function }}" ]; then
            echo "functions=${{ github.event.inputs.function }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            mapfile -t CHANGED < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'supabase/functions/**' \
              | awk -F/ 'NF>=3 {print $3}' | sort -u)
          else
            mapfile -t CHANGED < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          fi
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "functions=" >> "$GITHUB_OUTPUT"
          else
            echo "functions=${CHANGED[*]}" >> "$GITHUB_OUTPUT"
          fi
          printf 'Will deploy: %s\n' "${CHANGED[*]:-none}"

      - name: Deploy functions
        if: steps.list.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID secrets" >&2
            exit 1
          fi
          for slug in ${{ steps.list.outputs.functions }}; do
            echo "::group::Deploy $slug"
            supabase functions deploy "$slug" --project-ref "$SUPABASE_PROJECT_ID"
            echo "::endgroup::"
          done
