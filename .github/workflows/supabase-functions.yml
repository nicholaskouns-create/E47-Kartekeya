name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:
    inputs:
      function:
        description: "Optional single function slug (empty = changed functions)"
        required: false
        default: ""

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Resolve functions to deploy
        id: list
        shell: bash
        run: |
          set -euo pipefail

          requested="${{ github.event.inputs.function }}"
          if [ -n "$requested" ]; then
            if [ ! -d "supabase/functions/$requested" ]; then
              echo "Unknown function directory: $requested" >&2
              exit 1
            fi
            echo "functions=$requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t CANDIDATES < <(
            if [ "${{ github.event_name }}" = "push" ]               && [ -n "${{ github.event.before }}" ]               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'supabase/functions/**'
            else
              find supabase/functions -mindepth 2 -maxdepth 2 -type f -printf '%p\n'
            fi             | awk -F/ 'NF >= 4 {print $3}'             | sort -u
          )

          CHANGED=()
          for slug in "${CANDIDATES[@]}"; do
            [ -d "supabase/functions/$slug" ] && CHANGED+=("$slug")
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "functions=" >> "$GITHUB_OUTPUT"
            echo "No Edge Function directories changed."
          else
            echo "functions=${CHANGED[*]}" >> "$GITHUB_OUTPUT"
            printf 'Will deploy: %s\n' "${CHANGED[*]}"
          fi

      - name: Deploy functions
        if: steps.list.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice title=Supabase deploy skipped::SUPABASE_ACCESS_TOKEN is not configured. Source export remains valid; no runtime deployment was attempted."
            exit 0
          fi

          project_id="${SUPABASE_PROJECT_ID:-}"
          if [ -z "$project_id" ]; then
            project_id="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml | head -n1)"
          fi
          if [ -z "$project_id" ]; then
            echo "Unable to resolve Supabase project id" >&2
            exit 1
          fi

          for slug in ${{ steps.list.outputs.functions }}; do
            echo "::group::Deploy $slug"
            supabase functions deploy "$slug" --project-ref "$project_id"
            echo "::endgroup::"
          done
