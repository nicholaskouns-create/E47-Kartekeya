name: MATRIX CITY125 E47 AETHERIS validation
on:
  pull_request:
    paths:
      - 'website/js/matrix-city125-aetheris.js'
      - 'website/interfaces/matrix/matrix.js'
      - 'scripts/check_matrix_city125_aetheris.mjs'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/check_city_125_runtime.mjs
      - run: node scripts/check_matrix_city125_aetheris.mjs
