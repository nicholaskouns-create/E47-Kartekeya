name: Instrument Benchmarks

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmark autonomous research instruments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate contracts
        run: |
          python scripts/check_lab_contract.py
          python scripts/check_instrument_contracts.py
      - name: Run component-owned benchmarks
        run: python scripts/run_instrument_smokes.py --benchmark --receipt-dir artifacts/instrument-benchmarks
      - name: Upload benchmark provenance receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrument-benchmark-receipts
          path: artifacts/instrument-benchmarks/
          if-no-files-found: warn
