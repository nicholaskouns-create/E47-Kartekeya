name: Mathematical City distributed contract
on:
  push:
    paths:
      - '.github/workflows/research-engine-consumer.yml'
  workflow_dispatch:
  schedule:
    - cron: '27 12 * * 1'
permissions:
  contents: read
jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nicholaskouns-create/Radar
          ref: 46f696fd9479e4dcade7ffb0c79ac7978f6a9bf6
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate shared contract and public backend
        working-directory: upstream
        run: |
          python -m pip install pytest
          python -m pytest tests/test_research_engine.py -q
          python - <<'PY'
          import json,urllib.request
          from research_engine.sources import SOURCES
          assert SOURCES['acicula-iq-v3']['labels_verified'] is False
          url='https://gpkjvihkyectnenvnbng.supabase.co/functions/v1/research-engine-read'
          with urllib.request.urlopen(url,timeout=25) as response:
              payload=json.load(response)
          assert payload['schema_version']=='1.0'
          assert isinstance(payload['runs'],list)
          assert all('result' not in r and 'artifact_url' not in r for r in payload['runs'])
          print('Distributed evidence contract + public registry PASS')
          PY
