name: Route packets live

on:
  push:
    branches: ["main"]
    paths:
      - "website/interfaces/route-packets/**"
      - "website/data/readme-router.json"
      - "supabase/functions/city-route-packets/**"
      - ".github/workflows/route-packets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify live route-packet projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check local projection sources
        shell: bash
        run: |
          set -euo pipefail
          test -f website/interfaces/route-packets/index.html
          test -f website/data/readme-router.json
          test -f supabase/functions/city-route-packets/index.ts
          grep -q "CITY-ROUTE-PACKETS/1.0" supabase/functions/city-route-packets/index.ts
          grep -q "city-route-packets" website/interfaces/route-packets/index.html

      - name: Verify public route-packet API
        shell: bash
        run: |
          set -euo pipefail
          url="https://gpkjvihkyectnenvnbng.supabase.co/functions/v1/city-route-packets?limit=12"
          curl -fsSL --retry 5 --retry-delay 2 --max-time 30 "$url" -o /tmp/route-packets.json
          python - <<'PY'
          import json
          p = "/tmp/route-packets.json"
          data = json.load(open(p, encoding="utf-8"))
          assert data["schema"] == "CITY-ROUTE-PACKETS/1.0", data.get("schema")
          assert isinstance(data.get("packets"), list) and data["packets"], "no packets"
          assert data.get("counts", {}).get("registered_active_surfaces", 0) > 0, data.get("counts")
          for packet in data["packets"]:
              assert packet.get("id")
              assert packet.get("title")
              assert isinstance(packet.get("surfaces"), list)
          print("LIVE ROUTE PACKETS PASS")
          print("packets:", len(data["packets"]))
          print("counts:", data.get("counts"))
          PY
