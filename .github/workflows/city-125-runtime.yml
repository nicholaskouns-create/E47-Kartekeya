name: CITY 125 runtime validation
on:
  pull_request:
    paths:
      - 'website/js/city-125-runtime.js'
      - 'website/interfaces/city-125/**'
      - 'website/data/city-routing.json'
      - 'website/data/city-invariant.schema.json'
      - 'scripts/check_city_125_runtime.mjs'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/check_city_125_runtime.mjs
