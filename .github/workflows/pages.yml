name: Deploy website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "certificates/**"
      - "scripts/check_website.cjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "website/**"
      - "certificates/**"
      - "scripts/check_website.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check assets, certificate copies and rendering
        run: node --test scripts/check_website.cjs

  publish:
    name: Publish website root to gh-pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build gh-pages branch from website directory
        shell: bash
        run: |
          set -euo pipefail

          site_dir="$(mktemp -d)"
          cp -a website/. "$site_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan gh-pages-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$site_dir/." .
          touch .nojekyll

          git add -A
          git commit -m "Deploy website from ${GITHUB_SHA}"
          git push --force origin HEAD:refs/heads/gh-pages

      - name: Publish receipt
        shell: bash
        run: |
          {
            echo "## GitHub Pages publish receipt"
            echo
            echo "Published the validated \`website/\` directory as the root of \`gh-pages\`."
            echo
            echo "Pages URL: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } >> "$GITHUB_STEP_SUMMARY"
