name: Deploy website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "certificates/**"
      - "scripts/check_website.cjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "website/**"
      - "certificates/**"
      - "scripts/check_website.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check assets, certificate copies and rendering
        run: node --test scripts/check_website.cjs

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: pages-deploy

    steps:
      - uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deployment receipt
        shell: bash
        run: |
          {
            echo "## GitHub Pages deployment receipt"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Repository | \`${GITHUB_REPOSITORY}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Pages URL | ${{ steps.deployment.outputs.page_url }} |"
            echo "| Base URL | ${{ steps.pages.outputs.base_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed site responds
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --max-time 30 \
            -o /dev/null \
            "$PAGE_URL"
          echo "Public Pages endpoint responded successfully: $PAGE_URL"
