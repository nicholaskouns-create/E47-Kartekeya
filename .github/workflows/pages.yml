name: Deploy website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "certificates/**"
      - "scripts/check_website.cjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "website/**"
      - "certificates/**"
      - "scripts/check_website.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check assets, certificate copies and rendering
        run: node --test scripts/check_website.cjs

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify GitHub Pages control-plane state
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Querying GitHub Pages state for ${GH_REPO}"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/pages" > pages-state.json

          SITE_URL="$(jq -r '.html_url // empty' pages-state.json)"
          STATUS="$(jq -r '.status // empty' pages-state.json)"
          HTTPS="$(jq -r '.https_enforced // false' pages-state.json)"
          CNAME="$(jq -r '.cname // empty' pages-state.json)"
          BUILD_TYPE="$(jq -r '.build_type // empty' pages-state.json)"

          echo "site_url=${SITE_URL}" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "https_enforced=${HTTPS}" >> "$GITHUB_OUTPUT"
          echo "cname=${CNAME}" >> "$GITHUB_OUTPUT"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

          {
            echo "## GitHub Pages deployment receipt"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Repository | \`${GH_REPO}\` |"
            echo "| Deployment output | ${DEPLOYED_URL} |"
            echo "| Pages URL | ${SITE_URL:-n/a} |"
            echo "| Pages status | \`${STATUS:-unknown}\` |"
            echo "| HTTPS enforced | \`${HTTPS}\` |"
            echo "| Custom domain | ${CNAME:-none} |"
            echo "| Build type | \`${BUILD_TYPE:-unknown}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          test -n "$SITE_URL"
          test "$STATUS" = "built"

      - name: Verify deployed site responds
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --max-time 30 \
            -o /dev/null \
            "$PAGE_URL"
          echo "Public Pages endpoint responded successfully: $PAGE_URL"
