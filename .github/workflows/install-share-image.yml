name: Install social share image

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/install-share-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Install exact share image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/assets
          curl --fail --location --retry 3 --max-time 90 \
            'https://sdmntprwestus.oaiusercontent.com/files/00000000-2e88-8230-bfa2-bf4eb9692a24/raw?se=2026-09-17T18%3A00%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=1bbc1bd9-a460-5923-9749-5634130cdbb0&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A23%3A56Z&ske=2026-09-17T20%3A23%3A56Z&sks=b&skv=2026-02-06&sig=317rI8OPHkOC4J22Dyr3%2BFDCd/QdiugzYZFjQqiI704%3D' \
            --output website/assets/scientific-app-ecosystem-share.png
          echo '136eab5377cc36bc0dbfb7f54703ea0fa60852d2f4b26e284b6ae63bccc3847b  website/assets/scientific-app-ecosystem-share.png' | sha256sum --check --strict

      - name: Wire social metadata
        shell: python
        run: |
          from pathlib import Path

          path = Path("website/index.html")
          html = path.read_text()
          old = '''  <meta property="og:title" content="The Mathematical City" />
            <meta property="og:description" content="An executable research architecture for invariant computation." />
            <meta name="twitter:card" content="summary_large_image" />'''.replace('            ', '  ')
          new = '''  <meta property="og:title" content="The Mathematical City" />
          <meta property="og:description" content="An executable research architecture for invariant computation." />
          <meta property="og:type" content="website" />
          <meta property="og:url" content="https://nicholaskouns-create.github.io/E47-Kartekeya/" />
          <meta property="og:image" content="https://nicholaskouns-create.github.io/E47-Kartekeya/assets/scientific-app-ecosystem-share.png" />
          <meta property="og:image:type" content="image/png" />
          <meta property="og:image:width" content="1254" />
          <meta property="og:image:height" content="1254" />
          <meta property="og:image:alt" content="Scientific App Ecosystem — Launch Hub · The Mathematical City" />
          <meta name="twitter:card" content="summary_large_image" />
          <meta name="twitter:image" content="https://nicholaskouns-create.github.io/E47-Kartekeya/assets/scientific-app-ecosystem-share.png" />
          <meta name="twitter:image:alt" content="Scientific App Ecosystem — Launch Hub · The Mathematical City" />
          <link rel="canonical" href="https://nicholaskouns-create.github.io/E47-Kartekeya/" />'''
          if old not in html:
              raise SystemExit("Expected metadata block not found; refusing broad rewrite")
          path.write_text(html.replace(old, new, 1))

      - name: Commit installed asset and metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets/scientific-app-ecosystem-share.png website/index.html
          git commit -m "Add Scientific App Ecosystem share cover"
          git push origin HEAD:main
