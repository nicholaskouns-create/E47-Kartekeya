name: Fun With Einstein — Python, Lean and Coq
on:
  push:
    paths:
      - 'docs/fun-with-einstein/**'
      - '.github/workflows/fun-with-einstein.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-certificate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy sympy
      - run: python docs/fun-with-einstein/certificate.py
      - uses: actions/upload-artifact@v4
        with:
          name: einstein-python-results
          path: docs/fun-with-einstein/results.json
  coq-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y coq
          coqc --version
          coqc -q docs/fun-with-einstein/KKPSpectralBridge.v
  lean-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Lean/Mathlib project
        run: |
          mkdir lean-work
          cp docs/fun-with-einstein/KKPSpectralBridge.lean lean-work/
          printf '%s\n' leanprover/lean4:v4.35.0 > lean-work/lean-toolchain
          printf '%s\n' 'name = "einstein"' 'version = "0.1.0"' '[[require]]' 'name = "mathlib"' 'scope = "leanprover-community"' 'rev = "v4.35.0"' > lean-work/lakefile.toml
      - name: Install Lean and compile theorem source
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean-work
          lake update
          lake exe cache get
          lake env lean KKPSpectralBridge.lean
