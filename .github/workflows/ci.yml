name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Pytest – E47 canonical invariants
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

  drift-check:
    name: Certificate drift detection
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run validation and check canonical invariants
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          from e47.validation_results import run_all_validations, require_all_validations

          results = run_all_validations()
          require_all_validations(results)

          # Canonical E47 invariants – must never change
          assert results.qutip_validation.carrier_dimension == 125, \
              f"dim(V) drift: expected 125, got {results.qutip_validation.carrier_dimension}"
          assert results.qutip_validation.kernel_dimension == 47, \
              f"dim(E47) drift: expected 47, got {results.qutip_validation.kernel_dimension}"
          assert abs(results.qutip_validation.coherence_fraction - 47/125) < 1e-12, \
              f"coherence fraction drift: {results.qutip_validation.coherence_fraction}"
          assert results.qutip_validation.k2_spectral_gap == 11664, \
              f"spectral gap drift: expected 11664, got {results.qutip_validation.k2_spectral_gap}"

          summary = results.summarize()
          assert summary["projector_rank"] == 47, \
              f"projector rank drift: expected 47, got {summary['projector_rank']}"
          assert abs(summary["projector_trace"] - 47) < 1e-10, \
              f"projector trace drift: {summary['projector_trace']}"

          print("Drift check PASSED – all canonical E47 invariants are stable.")
          EOF
