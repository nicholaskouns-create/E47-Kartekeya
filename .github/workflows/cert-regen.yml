name: Regenerate validation certificate

on:
  workflow_dispatch:
    inputs:
      allow_invalid:
        description: "Write certificate even when validation fails"
        type: boolean
        default: false
  schedule:
    # Regenerate weekly on Monday at 03:00 UTC to catch environment drift
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate E47 validation certificate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Regenerate certificate
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.allow_invalid }}" = "true" ]; then
            EXTRA_ARGS="--allow-invalid"
          fi
          python scripts/generate_validation_certificate.py \
            --output artifacts/e47_validation_certificate.json \
            $EXTRA_ARGS

      - name: Commit and push updated certificate
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/e47_validation_certificate.json
          if git diff --staged --quiet; then
            echo "Certificate unchanged – no commit needed."
          else
            git commit -m "chore: regenerate E47 validation certificate [skip ci]"
            git push
          fi
