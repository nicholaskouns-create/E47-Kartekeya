name: City Watchtower

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    # Public-system heartbeat every six hours.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  watchtower:
    name: Public surfaces + handshake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Re-run City validators
        run: node --test scripts/check_website.cjs scripts/check_e47_bridge.cjs scripts/check_eidolon_receipt_binding.mjs scripts/check_watchtower_surfaces.cjs

      - name: Verify source handshake contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://mathematicalcity.notion.site/?pvs=74' website/index.html
          grep -Fq 'https://github.com/nicholaskouns-create/E47-Kartekeya' website/index.html
          grep -Fq '<title>The Mathematical City</title>' website/index.html
          grep -Fq 'Presentation never upgrades evidence class.' website/index.html
          grep -Fq 'interfaces/external-agents/' website/index.html

      - name: Probe named public surfaces
        run: node scripts/watchtower_probe.mjs

      - name: Publish watchtower summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Mathematical City Watchtower'
            echo
            echo "Run: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            if [ -f watchtower.tsv ]; then
              echo '| Surface | HTTP | URL |'
              echo '|---|---:|---|'
              while IFS=$'\t' read -r name code url; do
                echo "| ${name} | ${code} | ${url} |"
              done < watchtower.tsv
            else
              echo 'Public probes did not complete.'
            fi
            echo
            echo 'Named surfaces: personal-site root ≠ executable City subpath.'
            echo 'Source contract: Notion atlas ↔ executable City ↔ repository.'
          } >> "$GITHUB_STEP_SUMMARY"
