name: Verify Mathematical City Citizens & Spectral Kernels

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  matrix-test:
    name: Python ${{ matrix.python-version }} Precision Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib pytest qutip

    - name: Run E47 & Citizen Precision Tests
      run: |
        python -m pytest tests/ -v --assert=plain

    - name: Verify Core Spectral Contraction
      env:
        PYTHONPATH: src
      run: |
        python scripts/compile_spectral_kernel.py --verify
