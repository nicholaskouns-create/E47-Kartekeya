name: SKYRMION RT3 Direct Tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skyrmion-rt3-direct-tests.yml'
  workflow_dispatch:
jobs:
  rt3-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: RT3 numerical regression suite
        run: node scripts/check_skyrmion_rt3.cjs
      - name: RT3 instrument smoke and receipt
        run: node website/interfaces/skyrmion-rt3/smoke.mjs
