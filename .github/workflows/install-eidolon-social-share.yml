name: Install Eidolon social share

on:
  push:
    branches:
      - main
    paths:
      - '.github/eidolon-card.part4'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild social share image
        shell: bash
        run: |
          set -euo pipefail
          cat .github/eidolon-card.part1 .github/eidolon-card.part2 > /tmp/eidolon-card.b64
          base64 --decode .github/eidolon-card.part3 >> /tmp/eidolon-card.b64
          base64 --decode .github/eidolon-card.part4 >> /tmp/eidolon-card.b64
          base64 --decode /tmp/eidolon-card.b64 > website/assets/eidolon-social-share.jpg

          git rm .github/eidolon-card.part1 .github/eidolon-card.part2 .github/eidolon-card.part3 .github/eidolon-card.part4
          git add website/assets/eidolon-social-share.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace Eidolon social share image [skip ci]"
          git push
