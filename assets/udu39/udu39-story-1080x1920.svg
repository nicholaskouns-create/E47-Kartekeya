<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#bg)"/><rect x="60" y="70" width="960" height="1780" rx="36" fill="#0b131b" stroke="#c89457" stroke-width="3"/><text x="95" y="160" fill="#7bf0c5" font-family="Arial,Helvetica,sans-serif" font-size="29" letter-spacing="4">URUK · P325352 · EXECUTABLE PROOF</text><text x="95" y="310" fill="#fff" font-family="Georgia,serif" font-weight="700" font-size="92">THE UDU₃₉</text><text x="95" y="408" fill="#fff" font-family="Georgia,serif" font-weight="700" font-size="92">ATTRACTOR</text><text x="95" y="506" fill="#fff" font-family="Georgia,serif" font-weight="700" font-size="92">THEOREM</text><text x="95" y="575" fill="#aeb9c4" font-family="Arial,Helvetica,sans-serif" font-size="29">Semantic-accounting invariance in a Late Uruk ledger</text><g text-anchor="middle" font-family="Arial,Helvetica,sans-serif"><circle cx="540" cy="810" r="170" fill="#111c26" stroke="#2b475b" stroke-width="3"/><text x="540" y="775" fill="#93a0aa" font-size="30">RECORDED</text><text x="540" y="870" fill="#61d9ff" font-size="108" font-weight="700">41</text><text x="540" y="1030" fill="#c89457" font-size="62" font-weight="700">− 2 X-MARKED → 39</text><rect x="205" y="1125" width="670" height="260" rx="30" fill="#111c26" stroke="#2b475b"/><text x="540" y="1205" fill="#fff" font-size="50">16 + 6 + 17 = 39</text><text x="540" y="1290" fill="#fff" font-size="46">9 + 7 + 6 + 8 + 9 = 39</text><text x="540" y="1355" fill="#7bf0c5" font-size="28" font-weight="700">DISTINCT DECOMPOSITIONS · SAME ACCEPTED STATE</text><rect x="258" y="1490" width="564" height="112" rx="24" fill="#10251f" stroke="#7bf0c5"/><text x="540" y="1560" fill="#7bf0c5" font-size="39" font-weight="700">8 / 8 PYTHON CHECKS PASS</text></g><text x="540" y="1745" fill="#c89457" font-family="Georgia,serif" font-size="28" text-anchor="middle">ONE LEDGER · TWO DECOMPOSITIONS</text><text x="540" y="1790" fill="#c89457" font-family="Georgia,serif" font-size="28" text-anchor="middle">ONE ACCEPTED INVARIANT</text></svg>