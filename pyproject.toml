[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "e47-kartekeya"
version = "0.1.0"
description = "Finite-dimensional algebraic validation package for the E47 spectral kernel."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["e47", "spectral-kernel", "su2", "quantum", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Public Domain",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "qutip>=5.3.0",
]

[project.urls]
Homepage = "https://github.com/nicholaskouns-create/E47-Kartekeya"
Repository = "https://github.com/nicholaskouns-create/E47-Kartekeya"
Issues = "https://github.com/nicholaskouns-create/E47-Kartekeya/issues"
Documentation = "https://github.com/nicholaskouns-create/E47-Kartekeya#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
