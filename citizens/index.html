<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine-Validated Citizens · Mathematical City</title><style>body{margin:0;background:#07090d;color:#eef4f8;font:14px ui-monospace,monospace}main{max-width:1200px;margin:auto;padding:28px}h1{font:800 clamp(42px,8vw,92px)/.86 system-ui;letter-spacing:-.06em}.card{border:1px solid #27303a;padding:14px;margin:8px 0;border-radius:12px;background:#0d1118}.code{color:#70e8ff}.e{color:#8cffc8}.b{color:#aab5c2}.top{display:flex;gap:10px;flex-wrap:wrap}.pill{border:1px solid #31404d;border-radius:99px;padding:6px 10px}</style></head><body><main><div class="top"><span class="pill">CITY-INVARIANT 1.0</span><span class="pill">MACHINE-VALIDATED ONLY</span><span class="pill">HUMAN PROMOTION GATE RETAINED</span></div><h1>CITIZENS</h1><p>GitHub mirror of machine-validated Mathematical City identities. Enrollment preserves the source evidence class and boundary. It is not external scientific endorsement.</p><div id="list"></div><script>fetch('./citizens.json').then(r=>r.json()).then(xs=>{list.innerHTML=xs.map(x=>`<article class=card><div class=code>${x.citizen_code}</div><h2>${x.title}</h2><div class=e>${x.evidence_class} · ${x.validation_status}</div><p class=b>${x.boundary||''}</p></article>`).join('')})</script></main></body></html>
