<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Citizens · Mathematical City</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07090d;color:#eef4f8;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1280px;margin:auto;padding:28px}h1{font:800 clamp(44px,8vw,96px)/.86 system-ui;letter-spacing:-.06em;margin:.35em 0 .2em}p{line-height:1.5}.top,.stats,.meta{display:flex;gap:9px;flex-wrap:wrap}.pill,.tag{border:1px solid #31404d;border-radius:99px;padding:7px 11px}.stats{margin:18px 0}.stat{border:1px solid #27303a;background:#0d1118;border-radius:12px;padding:11px 14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{background:#0d1118;color:#eef4f8;border:1px solid #31404d;border-radius:10px;padding:11px 12px;font:inherit}input{flex:1;min-width:220px}.card{border:1px solid #27303a;padding:15px;margin:9px 0;border-radius:12px;background:#0d1118}.row{display:flex;justify-content:space-between;gap:12px}.code{color:#70e8ff}.b{color:#aab5c2}.links a,a{color:#9cdcff;text-decoration:none}.g2{border-color:#375b55}.empty{padding:30px;text-align:center;color:#8795a1}@media(max-width:700px){main{padding:16px 14px 28px}.row{display:block}h1{font-size:clamp(38px,13vw,58px)}}button,a,input,select{touch-action:manipulation}
</style></head><body><main>
<div class="top"><span class="pill">MATHEMATICAL CITY</span><span class="pill">COMPLETE ACTIVE NOTION ROLL</span><span class="pill">377 CITIZENS</span></div>
<h1>CITIZENS</h1>
<p>Complete active mirror of the <a href="https://mathematicalcity.notion.site/be16a65a0eb44f8faa866e1c62b7c097?v=1aafa2ad38234c59886fa69c764d6a1b">Roll of Mathematical Citizens</a>. The Notion roll is the source registry; this page mirrors the full active census without adding a parallel hierarchy.</p>
<div class="stats"><div class="stat"><b id="population">377</b><br><span class="b">citizens</span></div><div class="stat"><b id="shown">…</b><br><span class="b">shown</span></div></div>
<div class="toolbar"><input id="q" placeholder="Search citizen, identity, borough…"><select id="filter"><option value="all">All citizens</option><option value="validated">Machine validated</option><option value="g2">Generation II</option></select></div>
<div id="list"><div class="empty">Loading complete registry…</div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let rows=[];
function normalize(x){return {
 civic_id:x.civic_id??null,
 citizen:x.citizen||x.citizen_code||'',
 identity:x.identity||x.canonical_identity||'',
 evidence:x.evidence||x.evidence_class||'',
 machine_validated:!!x.machine_validated,
 borough:x.borough||x.primary_borough||'',
 correction:x.correction||x.correction_status||'',
 route_status:x.route_status||'',
 boundary:x.boundary||'',
 notion_url:x.notion_url||'',
 generation:(/-G2-/.test(x.citizen||x.citizen_code||'')?2:(x.generation||1))
}}
function render(){
 const needle=q.value.trim().toLowerCase(),mode=filter.value;
 const xs=rows.filter(x=>{
  if(mode==='validated'&&!x.machine_validated)return false;
  if(mode==='g2'&&x.generation!==2)return false;
  const hay=[x.citizen,x.identity,x.borough,x.evidence,x.boundary].join(' ').toLowerCase();
  return !needle||hay.includes(needle)
 });
 shown.textContent=xs.length;
 list.innerHTML=xs.length?xs.map(x=>`<article class="card ${x.generation===2?'g2':''}">
 <div class=row><div><div class=code>MC-${esc(x.civic_id)} · ${esc(x.citizen)}</div><h2>${esc(x.identity||x.citizen)}</h2></div><div class=b>${x.generation===2?'GEN II':'GEN I'}</div></div>
 <div class=meta>${x.evidence?`<span class=tag>${esc(x.evidence)}</span>`:''}${x.machine_validated?'<span class=tag>machine validated</span>':''}${x.borough?`<span class=tag>${esc(x.borough)}</span>`:''}</div>
 ${x.boundary?`<p class=b>${esc(x.boundary)}</p>`:''}
 ${x.notion_url?`<div class=links><a href="${esc(x.notion_url)}">Notion record ↗</a></div>`:''}
 </article>`).join(''):'<div class=empty>No citizens match this view.</div>'
}
fetch('./citizens.json').then(r=>r.json()).then(m=>{
 rows=(m.citizens||[]).map(normalize).sort((a,b)=>(a.civic_id||0)-(b.civic_id||0));
 population.textContent=rows.length;
 q.oninput=render;filter.onchange=render;render();
}).catch(e=>{list.innerHTML='<div class=empty>Registry load failed.</div>';console.error(e)});
</script></main></body></html>
