<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Machine-Validated Citizens · Mathematical City</title><style>
body{margin:0;background:#07090d;color:#eef4f8;font:14px ui-monospace,monospace}main{max-width:1200px;margin:auto;padding:28px}h1{font:800 clamp(42px,8vw,92px)/.86 system-ui;letter-spacing:-.06em}h2.section{font:800 clamp(28px,5vw,50px)/.95 system-ui;letter-spacing:-.04em;margin-top:42px}.card{border:1px solid #27303a;padding:14px;margin:8px 0;border-radius:12px;background:#0d1118}.code{color:#70e8ff}.e{color:#8cffc8}.b{color:#aab5c2}.top{display:flex;gap:10px;flex-wrap:wrap}.pill{border:1px solid #31404d;border-radius:99px;padding:6px 10px}.summary{border:1px solid #315160;background:#0a151b;border-radius:14px;padding:16px;margin:14px 0 20px}.hash{overflow-wrap:anywhere;color:#829eaa;font-size:12px}
html,body{overflow-x:clip}.pill,.card{min-height:44px}
@media(max-width:700px){main{padding:16px 14px calc(24px + env(safe-area-inset-bottom))}h1{font-size:clamp(36px,12vw,56px)}p{font-size:15px;line-height:1.5}.pill{font-size:12px;padding:8px 12px;display:inline-flex;align-items:center}.card{padding:16px}.card h3{font-size:20px}.code,.e,.b{font-size:13px;line-height:1.45}}
button,a,[role=button],summary,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:not(:disabled),a[href],[role=button]{cursor:pointer}
</style></head><body><main>
<div class="top"><span class="pill">CITY-INVARIANT 1.0</span><span class="pill">MACHINE-VALIDATED ONLY</span><span class="pill">E47 MURMURATION G2</span></div>
<h1>CITIZENS</h1>
<p>GitHub mirror of machine-validated Mathematical City identities and their deterministic second-generation progeny census.</p>
<h2 class="section">Generation I</h2><div id="list"></div>
<h2 class="section">Generation II Census</h2>
<div class="summary" id="g2summary">Loading second-generation census…</div><div id="g2"></div>
<script>
Promise.all([
 fetch('./citizens.json').then(r=>r.json()),
 fetch('./second_generation_census.json').then(r=>r.json())
]).then(([xs,c])=>{
 list.innerHTML=xs.map(x=>`<article class=card><div class=code>${x.citizen_code}</div><h3>${x.title}</h3><div class=e>${x.evidence_class} · ${x.validation_status}</div><p class=b>${x.boundary||''}</p></article>`).join('');
 g2summary.innerHTML=`<b>${c.population} second-generation citizens</b><br>One synchronized E47 murmuration pass · 125-state carrier · rank 47 · q* = 15/17<br><span class=e>Python-validated progeny seeds · unique codes · unique SHA-256 identity fingerprints</span>`;
 g2.innerHTML=c.citizens.map(x=>`<article class=card><div class=code>${x.citizen_code}</div><h3>Progeny of ${x.parent_citizen_code}</h3><div class=e>Generation ${x.generation} · ${x.validation_status}</div><p class=b>${x.identity_status}</p><div class=hash>SHA-256 ${x.identity_fingerprint_sha256}</div></article>`).join('');
});
</script></main></body></html>
