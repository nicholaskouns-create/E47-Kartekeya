*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;color:#eaffff;font-family:system-ui,-apple-system,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.chip,.panel,button{background:#061118d9;border:1px solid #7fffe944;color:#eaffff;border-radius:14px;backdrop-filter:blur(12px)}.chip{padding:8px 10px;font-size:10px;letter-spacing:.12em}.bottom{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}.panel{pointer-events:auto;padding:9px;max-width:78vw}.crafts{display:flex;gap:6px;flex-wrap:wrap}button{pointer-events:auto;padding:9px 11px;font-weight:700}button.on{border-color:#8ff;background:#123a3a}.stick{pointer-events:auto;width:112px;height:112px;border-radius:50%;border:1px solid #8ff6;background:#06111899;position:relative;touch-action:none}.knob{position:absolute;width:42px;height:42px;border-radius:50%;background:#9ff5;border:1px solid #aff;left:35px;top:35px}.ret{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);border:1px solid #aff8;border-radius:50%}.ret:after{content:"";position:absolute;left:-15px;right:-15px;top:21px;height:1px;background:#aff8}@media(max-width:700px){.top .optional{display:none}.panel{max-width:64vw}.crafts button{font-size:9px;padding:7px}}
</style></head><body><canvas id="world"></canvas><div class="hud"><div class="top"><span class="chip">SKYRMION · LIVE FLIGHT</span><span id="tele" class="chip">F-16 · 420 KT · 12,000 FT</span><span id="gps" class="chip">36.169900° N · 115.139800° W · 3,600 m</span><span class="chip optional">2D SAFE RUNTIME · NO EXTERNAL ENGINE</span></div><div class="ret"></div><div class="bottom"><div class="panel"><div id="crafts" class="crafts"></div><div style="font-size:9px;opacity:.7;margin-top:6px">DRAG STICK · WASD/ARROWS · 1–6 CRAFT · F DOMAIN</div></div><div id="stick" class="stick"><div id="knob" class="knob"></div></div></div></div><script type="module">

</script><script>
(()=>{const c=document.getElementById('world'),x=c.getContext('2d',{alpha:false}),tele=document.getElementById('tele'),stick=document.getElementById('stick'),knob=document.getElementById('knob'),gps=document.getElementById('gps');let W,H,D=1,t=0,roll=0,pitch=0,tr=0,tp=0,spd=420,alt=12000,domain=0,active=0,drag=0,lat=36.1699,lon=-115.1398,heading=0;const craft=['F-16','SR-71','X-15','EIDOLON','MANTA','SYNTAX JACOB'],base=[420,1650,3100,680,540,900];
let mantaWorker=null,mantaFrame=null,mantaReady=false,mantaBusy=false,lastMantaStep=0,mantaError='',gpsSeeded=false;
addEventListener('city:gps',e=>{const g=e.detail;if(!gpsSeeded&&g?.source==='device'){lat=g.lat;lon=g.lon;gpsSeeded=true;}});
function initManta(){
  if(mantaWorker)return;
  mantaWorker=new Worker('./manta-worker.js');
  mantaWorker.onmessage=({data})=>{
    if(data?.type==='ready'){mantaReady=true;mantaError='';}
    else if(data?.type==='frame'){mantaFrame=data.state;mantaBusy=false;}
    else if(data?.type==='error'){mantaError=data.error||'runtime error';mantaBusy=false;}
  };
  mantaWorker.onerror=e=>{mantaError=e.message||'worker error';mantaBusy=false;};
  mantaWorker.postMessage({type:'init',schema:'MANTA-PYTHON-BRIDGE-1.0'});
}
function stepManta(now){
  if(active!==4||!mantaReady||mantaBusy||now-lastMantaStep<34)return;
  lastMantaStep=now;mantaBusy=true;
  const effort=Math.min(1,Math.abs(pitch)+Math.abs(roll));
  const mode=domain===0?(effort>.45?'MANEUVER':'CRUISE'):'TRANSITION';
  mantaWorker.postMessage({type:'step',pilot:{pitch,roll,yaw:tr,morph:effort,mode}});
}
function size(){D=Math.min(devicePixelRatio||1,2)*(window.CITY_CINEMA_CODEC?.state?.scale||1);D=Math.max(.65,D);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);addEventListener('city:render-scale',size);size();const root=document.getElementById('crafts');craft.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{active=i;if(i===4)initManta();[...root.children].forEach((q,j)=>q.classList.toggle('on',j===i))};root.appendChild(b)});root.children[0].classList.add('on');function input(px,py){let r=stick.getBoundingClientRect(),dx=Math.max(-1,Math.min(1,(px-r.left-r.width/2)/(r.width*.34))),dy=Math.max(-1,Math.min(1,(py-r.top-r.height/2)/(r.height*.34)));tr=dx*.8;tp=-dy*.5;knob.style.transform='translate('+dx*32+'px,'+dy*32+'px)'}stick.onpointerdown=e=>{drag=1;stick.setPointerCapture(e.pointerId);input(e.clientX,e.clientY)};stick.onpointermove=e=>{if(drag)input(e.clientX,e.clientY)};stick.onpointerup=stick.onpointercancel=()=>{drag=0;tr=tp=0;knob.style.transform='none'};const keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key>='1'&&e.key<='6')root.children[+e.key-1].click();if(e.key.toLowerCase()==='f')domain=(domain+1)%3};onkeyup=e=>keys[e.key.toLowerCase()]=0;function drawManta(){
  const g=mantaFrame?.geometry||[],act=mantaFrame?.activation||[];if(g.length<375)return false;
  x.save();x.translate(W/2,H*.61);x.rotate(roll*.42);const pts=[];
  for(let i=0;i<125;i++){const j=i*3;pts.push([g[j]*14,g[j+2]*12-g[j+1]*22,act[i]||0]);}
  x.lineWidth=1;x.strokeStyle='#8ff3';
  for(let a=0;a<5;a++)for(let b=0;b<5;b++)for(let c0=0;c0<5;c0++){
    const i=a*25+b*5+c0,p=pts[i];
    for(const ni of [a<4?i+25:-1,b<4?i+5:-1,c0<4?i+1:-1])if(ni>=0){const q=pts[ni];x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1]);x.stroke();}
  }
  for(const p of pts){x.globalAlpha=.28+.72*p[2];x.fillStyle='#9cebd5';x.beginPath();x.arc(p[0],p[1],1.2+2.2*p[2],0,Math.PI*2);x.fill();}
  x.globalAlpha=1;x.strokeStyle='#dfffff';x.lineWidth=1.4;x.beginPath();x.moveTo(-68,8);x.quadraticCurveTo(0,-34,68,8);x.quadraticCurveTo(0,34,-68,8);x.stroke();x.restore();return true;
}
function jet(){if(active===4&&mantaFrame&&drawManta())return;x.save();x.translate(W/2,H*.61);x.rotate(roll*.5);x.fillStyle=active<3?'#dce8e9':active===4?'#9cebd5':'#c6c5ff';x.shadowBlur=active<3?8:28;x.shadowColor='#76fff0';x.beginPath();x.moveTo(0,-45);x.lineTo(9,12);x.lineTo(65,33);x.lineTo(60,42);x.lineTo(10,29);x.lineTo(5,55);x.lineTo(-5,55);x.lineTo(-10,29);x.lineTo(-60,42);x.lineTo(-65,33);x.lineTo(-9,12);x.closePath();x.fill();x.fillStyle='#071820';x.beginPath();x.ellipse(0,-8,6,16,0,0,7);x.fill();if(active>=3){x.strokeStyle='#7ff';x.lineWidth=2;x.beginPath();x.ellipse(0,18,34+Math.sin(t*4)*4,12,0,0,7);x.stroke()}x.restore()}function draw(){requestAnimationFrame(draw);t+=.016;let kr=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),kp=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);roll+=(Math.max(-.9,Math.min(.9,tr+kr*.7))-roll)*.06;pitch+=(Math.max(-.55,Math.min(.55,tp+kp*.4))-pitch)*.06;if(active===4){initManta();stepManta(performance.now())}spd+=(base[active]-spd)*.012;alt=Math.max(50,alt+pitch*25);heading+=roll*.0018;const metersPerSec=spd*.514444;const step=metersPerSec*.016;lat+=(Math.cos(heading)*step/6378137)*180/Math.PI;lon+=(Math.sin(heading)*step/(6378137*Math.max(.000001,Math.cos(lat*Math.PI/180))))*180/Math.PI;let g=x.createLinearGradient(0,0,0,H);if(domain===0){g.addColorStop(0,'#07152f');g.addColorStop(.48,'#2878a6');g.addColorStop(1,'#cbbf98')}else{g.addColorStop(0,'#010208');g.addColorStop(1,domain===1?'#09233c':'#080816')}x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(W/2,H/2+pitch*H*.42);x.rotate(-roll*.55);if(domain===0){x.fillStyle='#253d2b';x.fillRect(-W,-2,W*2,H);x.strokeStyle='#ffffff24';let flow=(t*spd*.22)%60;for(let y=20-flow;y<H;y+=60){x.beginPath();x.moveTo(-W,y);x.lineTo(W,y);x.stroke()}for(let i=-10;i<=10;i++){x.beginPath();x.moveTo(W/2+i*8,0);x.lineTo(W/2+i*120,H);x.stroke()}}else{for(let i=0;i<100;i++){let sx=(i*97+t*spd*.04)%W,sy=(i*i*31)%H;x.fillStyle='#dff';x.fillRect(sx,sy,1+(i%13===0),1+(i%13===0))}if(domain===1){x.fillStyle='#16466d';x.beginPath();x.arc(0,H*1.25,W,0,7);x.fill()}}x.restore();jet();const mantaTele=active===4?(mantaFrame?' · Ω '+mantaFrame.e47_capture.toFixed(3)+' · R '+Number(mantaFrame.residual).toExponential(1):(mantaError?' · PYTHON FALLBACK':' · PYTHON LOADING')):'';tele.textContent=craft[active]+' · '+Math.round(spd)+' KT · '+Math.round(alt).toLocaleString()+' FT'+mantaTele;const ns=lat>=0?'N':'S',ew=lon>=0?'E':'W';gps.textContent=Math.abs(lat).toFixed(6)+'° '+ns+' · '+Math.abs(lon).toFixed(6)+'° '+ew+' · '+Math.round(alt*.3048).toLocaleString()+' m';}draw();})();
</script></body></html>
