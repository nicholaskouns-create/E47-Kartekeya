<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9fdcff">
<meta name="description" content="MANTA programmable-matter 6DOF A/B research flight lab.">
<title>MANTA // Mathematical City</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
:root{--ink:#efffff;--cyan:#7fffe9;--mint:#bfffd7;--line:#8fffe744;--glass:#071015c7;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fdcff;color:var(--ink);font-family:var(--sans)}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#8fd2f0 0%,#c8ecf6 60%,#d8b98a 100%)}
#terrain3d{z-index:0!important}
.hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:7px;align-items:center}
.brand,.chip,.btn,.bar,.drawer{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(13px);box-shadow:0 8px 34px #001b2420}
.brand{padding:9px 11px;border-radius:13px}.brand b{display:block;font-size:16px;letter-spacing:.04em}.brand small{display:block;margin-top:3px;color:#a9dfd9;font:700 8px var(--mono);letter-spacing:.12em}
.top-right{margin-left:auto;display:flex;gap:6px}.chip,.btn{border-radius:999px;min-height:36px;padding:0 11px;display:inline-flex;align-items:center;font:700 9px var(--mono);color:var(--ink);text-decoration:none;white-space:nowrap}
#status{color:var(--cyan)}.fault{color:#ff9c90!important}
.bottom{position:absolute;left:12px;right:12px;bottom:max(11px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}
.controls{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap}.btn{cursor:pointer}.btn.primary{background:#dffffa;color:#042526;border-color:#dffffa}
.bar{margin-left:auto;border-radius:13px;padding:8px 10px;display:grid;grid-template-columns:auto auto auto auto;gap:5px 13px;align-items:center;font:700 9px var(--mono)}
.bar span{color:#94b7b5}.bar b{color:white}.bar .delta{color:var(--mint)}
.drawer{position:absolute;left:12px;right:12px;bottom:74px;border-radius:15px;padding:10px;transform:translateY(calc(100% + 100px));opacity:0;transition:.2s;pointer-events:none}
.show-data .drawer{transform:none;opacity:1;pointer-events:auto}.drawer-head{display:flex;align-items:center;gap:8px}.drawer-head strong{font:800 10px var(--mono);letter-spacing:.12em;color:var(--cyan)}.drawer-head .btn{margin-left:auto;pointer-events:auto}
.metrics{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:9px}.metric{border:1px solid #8fffe72a;background:#06101599;border-radius:9px;padding:8px}.metric span{display:block;color:#8fafad;font:700 7px var(--mono)}.metric b{display:block;margin-top:4px;font:800 11px var(--mono)}
#fault{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);max-width:80vw;padding:14px;border-radius:13px;background:#4a0808;color:white;font:12px var(--mono)}
@media(max-width:760px){.brand small{display:none}.top-right .chip:nth-child(3){display:none}.top-right a{display:none}.bar{grid-template-columns:auto auto;gap:3px 9px;font-size:8px}.metrics{grid-template-columns:repeat(2,1fr)}.controls #pause{display:none}.drawer{bottom:66px}}
</style>
</head>
<body>
<div class="hud">
  <div class="top">
    <div class="brand"><b>MANTA</b><small>PROGRAMMABLE MATTER · 6DOF A/B FLIGHT LAB</small></div>
    <div class="top-right">
      <span id="status" class="chip">BOOTING</span>
      <span id="clock" class="chip">0.0 / 48s</span>
      <span id="phase" class="chip">CLIMB</span>
      <span id="world" class="chip">WORLD</span>
      <a class="chip" href="../kouns-core/?module=manta#labs">CITY CORE</a>
    </div>
  </div>
  <div class="bottom">
    <div class="controls">
      <button id="run" class="btn primary">RUN</button>
      <button id="pause" class="btn">PAUSE</button>
      <button id="fast" class="btn">1×</button>
      <button id="reset" class="btn">RESET</button>
      <button id="data" class="btn">DATA</button>
    </div>
    <div class="bar">
      <span>MORPH</span><b id="speedM">—</b>
      <span>FIXED</span><b id="speedB">—</b>
      <span>Δ SPEED</span><b id="dSpeed" class="delta">—</b>
      <span>Δ ALT</span><b id="dAlt" class="delta">—</b>
    </div>
  </div>
  <section class="drawer">
    <div class="drawer-head"><strong>LIVE MORPH COUPLING</strong><button id="closeData" class="btn">CLOSE</button></div>
    <div class="metrics">
      <div class="metric"><span>CL</span><b id="cl">—</b></div>
      <div class="metric"><span>CD</span><b id="cd">—</b></div>
      <div class="metric"><span>Cm</span><b id="cm">—</b></div>
      <div class="metric"><span>MASS</span><b id="mass">—</b></div>
      <div class="metric"><span>ṁ</span><b id="mdot">—</b></div>
      <div class="metric"><span>MORPH ENERGY</span><b id="energy">—</b></div>
      <div class="metric"><span>Ixx / Iyy / Izz</span><b id="inertia">—</b></div>
    </div>
  </section>
</div>
<div id="fault" hidden></div>
<script type="module" src="./app.js?v=20260919-real-manta"></script>
</body>
</html>
