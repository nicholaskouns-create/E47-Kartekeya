<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1070" viewBox="0 0 840 1070" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">The E47 spectral kernel</title><desc id="plate-desc">Seven total-spin sectors. Spins 2 and 5 retain 25 and 22 coordinates. The other 78 contract with exact worst-case factor 15/17.</desc><rect width="840" height="1070" fill="#fffefa"/><text x="46" y="51" fill="#00665e" font-family="DejaVu Sans" font-size="15" font-weight="bold">MATHEMATICAL CITY     /     REPRESENTATION THEORY</text><text x="44" y="125" fill="#182629" font-family="DejaVu Serif" font-size="55" font-weight="normal">The E₄₇ spectral kernel</text><text x="46" y="168" fill="#182629" font-family="DejaVu Sans" font-size="20" font-weight="normal">Three spin-2 factors give 125 coordinates. Two Casimir shells retain 47.</text><path d="M46 192H794" stroke="#80918d"/><text x="46" y="229" fill="#182629" font-family="DejaVu Serif" font-size="26" font-weight="normal">Shell selection</text><text x="46" y="263" fill="#182629" font-family="DejaVu Sans" font-size="17" font-weight="normal">C = (J₁ + J₂ + J₃)²     •     eigenvalue cⱼ = J(J + 1)     •     trace mean 18, deviation 12</text><text x="46" y="298" fill="#182629" font-family="DejaVu Sans" font-size="17" font-weight="normal">K = (C − 6I)(C − 30I)     •     shell values 18 − 12 = 6 and 18 + 12 = 30</text><text x="49" y="371" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">0</text><text x="123" y="371" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">0</text><text x="240" y="371" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">1</text><text x="365" y="371" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">1</text><text x="660" y="371" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">32,400</text><rect x="411" y="359" width="7" height="9" fill="#9aa7a5"/><text x="49" y="402" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">1</text><text x="123" y="402" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">2</text><text x="240" y="402" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">3</text><text x="365" y="402" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">9</text><text x="660" y="402" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">12,544</text><rect x="411" y="390" width="63" height="9" fill="#9aa7a5"/><rect x="40" y="411" width="756" height="29" rx="2" fill="#deeee8"/><text x="49" y="433" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">2</text><text x="123" y="433" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">6</text><text x="240" y="433" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">5</text><text x="365" y="433" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">25</text><text x="660" y="433" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">0</text><rect x="411" y="421" width="175" height="9" fill="#00665e"/><text x="49" y="464" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">3</text><text x="123" y="464" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">12</text><text x="240" y="464" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">4</text><text x="365" y="464" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">28</text><text x="660" y="464" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">11,664</text><rect x="411" y="452" width="196" height="9" fill="#9aa7a5"/><text x="49" y="495" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">4</text><text x="123" y="495" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">20</text><text x="240" y="495" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">3</text><text x="365" y="495" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">27</text><text x="660" y="495" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">19,600</text><rect x="411" y="483" width="189" height="9" fill="#9aa7a5"/><rect x="40" y="504" width="756" height="29" rx="2" fill="#deeee8"/><text x="49" y="526" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">5</text><text x="123" y="526" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">30</text><text x="240" y="526" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">2</text><text x="365" y="526" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">22</text><text x="660" y="526" fill="#00665e" font-family="DejaVu Sans" font-size="18" font-weight="normal">0</text><rect x="411" y="514" width="154" height="9" fill="#00665e"/><text x="49" y="557" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">6</text><text x="123" y="557" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">42</text><text x="240" y="557" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">1</text><text x="365" y="557" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">13</text><text x="660" y="557" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">186,624</text><rect x="411" y="545" width="91" height="9" fill="#9aa7a5"/><text x="49" y="339" fill="#182629" font-family="DejaVu Sans" font-size="15" font-weight="bold">Spin J</text><text x="123" y="339" fill="#182629" font-family="DejaVu Sans" font-size="15" font-weight="bold">cⱼ</text><text x="240" y="339" fill="#182629" font-family="DejaVu Sans" font-size="15" font-weight="bold">Copies</text><text x="365" y="339" fill="#182629" font-family="DejaVu Sans" font-size="15" font-weight="bold">States</text><text x="660" y="339" fill="#182629" font-family="DejaVu Sans" font-size="15" font-weight="bold">K² value</text><path d="M46 578H794" stroke="#80918d"/><text x="46" y="623" fill="#00665e" font-family="DejaVu Serif" font-size="36" font-weight="normal">25 + 22 = 47</text><text x="382" y="612" fill="#182629" font-family="DejaVu Sans" font-size="21" font-weight="normal">Fixed space  5V₂ ⊕ 2V₅</text><text x="382" y="642" fill="#182629" font-family="DejaVu Sans" font-size="17" font-weight="normal">Orthogonal complement  125 − 47 = 78</text><path d="M46 665H794" stroke="#80918d"/><text x="46" y="705" fill="#182629" font-family="DejaVu Serif" font-size="26" font-weight="normal">Exact contraction</text><text x="46" y="742" fill="#182629" font-family="DejaVu Sans" font-size="22" font-weight="normal">Γ = I − εK²      ε = 2/(11,664 + 186,624) = 1/99,144</text><text x="46" y="778" fill="#182629" font-family="DejaVu Sans" font-size="18" font-weight="normal">The endpoint multipliers are +15/17 and −15/17. Both attain the bound.</text><text x="46" y="823" fill="#00665e" font-family="DejaVu Sans" font-size="32" font-weight="normal">‖Γⁿ − P‖₂ = (15/17)ⁿ</text><text x="46" y="858" fill="#182629" font-family="DejaVu Sans" font-size="17" font-weight="normal">P projects orthogonally onto ker K = Fix(Γ). Here n counts iterations.</text><path d="M46 884H794" stroke="#80918d"/><text x="46" y="921" fill="#182629" font-family="DejaVu Serif" font-size="23" font-weight="normal">Arithmetic corrections</text><text x="46" y="955" fill="#182629" font-family="DejaVu Sans" font-size="17" font-weight="normal">α = (125/47)² ≈ 7.07333635. At input spin 44, the upper shell has J = 99.</text><text x="46" y="985" fill="#182629" font-family="DejaVu Sans" font-size="17" font-weight="normal">Upper-shell integer spins require 2j + 1 = Fₖ with k odd and 3 ∤ k.</text><path d="M46 1010H794" stroke="#80918d"/><text x="46" y="1041" fill="#182629" font-family="DejaVu Sans" font-size="15" font-weight="normal">Nicholas Shane Kouns, DO</text><text x="550" y="1041" fill="#00665e" font-family="DejaVu Sans" font-size="15" font-weight="normal">6 November 2026   /   E₄₇</text></svg>